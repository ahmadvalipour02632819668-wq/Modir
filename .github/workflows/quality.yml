name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in core.js menu-ui.js alert-ui.js alert-center.js sms.js pwa.js media.js assistant.js shell.js account-ui.js period-ui.js dashboard-ui.js dashboard.js community.js finance.js management.js navigation.js; do
            node --check "$file"
          done
      - name: Check application structure and public APIs
        run: node scripts/check-structure.mjs

name: Database integration tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.12.0.000
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: supabase_admin
          POSTGRES_DB: modir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d modir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run isolated payment correction integration tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U supabase_admin -d modir_test -v ON_ERROR_STOP=1 -f supabase/tests/payment_correction_fixture.sql
          psql -h localhost -U supabase_admin -d modir_test -v ON_ERROR_STOP=1 -f supabase/tests/payment_correction_exit_preview_fixture.sql
          psql -h localhost -U supabase_admin -d modir_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261117195550_apply_payment_corrections_to_account_exit_preview.sql
          test_output="$(psql -X -h localhost -U supabase_admin -d modir_test -v ON_ERROR_STOP=1 -f supabase/tests/payment_correction_schema.test.sql 2>&1)"
          printf '%s\n' "$test_output"
          if printf '%s\n' "$test_output" | grep -Eq 'not ok [0-9]+|# Looks like you failed'; then
            echo "pgTAP reported failed assertions."
            exit 1
          fi
          if ! printf '%s\n' "$test_output" | grep -q '1..26'; then
            echo "pgTAP plan output missing; refusing to pass."
            exit 1
          fi

name: Build Resident Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
      - "index.html"
      - "superadmin.html"
      - "shell.js"
      - "app.css"
      - "manifest.webmanifest"
      - "icone.png"
      - "icone-192.png"
      - "icone-512.png"
      - "resident-manager-icon.svg"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare bundled web fallback
        run: |
          mkdir -p www
          cp index.html *.js *.css *.png *.svg manifest.webmanifest www/

      - name: Configure APK to use bundled local web assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("capacitor.config.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          # The website remains hosted remotely; the APK must load its bundled www files.
          config.pop("server", None)
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("APK configured to load local Capacitor assets (no remote server.url).")
          PY

      - name: Install dependencies
        run: npm install

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify bundled startup assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          public_dir = Path("android/app/src/main/assets/public")
          required = ["index.html", "assistant.js", "core.js", "navigation.js", "app.css"]
          missing = [name for name in required if not (public_dir / name).is_file()]
          if missing:
              raise SystemExit("Missing bundled APK assets: " + ", ".join(missing))

          config_path = Path("android/app/src/main/assets/capacitor.config.json")
          if not config_path.is_file():
              raise SystemExit("Generated Capacitor config is missing")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          if config.get("server", {}).get("url"):
              raise SystemExit("APK still points to a remote server.url")
          print("Verified local startup bundle:", ", ".join(required))
          PY

      - name: Set Android release version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file not found")
          lines = gradle.read_text(encoding="utf-8").splitlines()
          found_code = found_name = False
          for i, line in enumerate(lines):
              if re.match(r"\s*versionCode\s*(?:=\s*)?\d+", line):
                  prefix = re.match(r"\s*", line).group(0)
                  lines[i] = prefix + "versionCode 4" if "=" not in line else prefix + "versionCode = 4"
                  found_code = True
              elif re.match(r"\s*versionName\s*(?:=\s*)?['\"][^'\"]+['\"]", line):
                  prefix = re.match(r"\s*", line).group(0)
                  lines[i] = prefix + 'versionName "1.0.3"' if "=" not in line else prefix + 'versionName = "1.0.3"'
                  found_name = True
          if not found_code or not found_name:
              raise SystemExit(f"Could not set Android version (versionCode={found_code}, versionName={found_name})")
          gradle.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Configured Android versionCode=4 versionName=1.0.3 in {gradle}")
          PY

      - name: Enable immersive navigation bar mode
        run: |
          MAIN_ACTIVITY="android/app/src/main/java/ir/ahmadvalipour/residentmanager/MainActivity.java"
          mkdir -p "$(dirname "$MAIN_ACTIVITY")"
          cat > "$MAIN_ACTIVITY" <<'JAVA'
          package ir.ahmadvalipour.residentmanager;

          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private void hideNavigationBar() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  );
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideNavigationBar();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideNavigationBar();
                  }
              }
          }
          JAVA

      - name: Apply official Resident Manager launcher icon
        run: |
          python -m pip install pillow cairosvg
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import cairosvg
          import shutil

          cairosvg.svg2png(url="resident-manager-icon.svg", write_to="/tmp/resident-manager-icon.png", output_width=512, output_height=512)
          src = Image.open("/tmp/resident-manager-icon.png").convert("RGBA")
          root = Path("android/app/src/main/res")
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for density, size in sizes.items():
              folder = root / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = src.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          # Use the density-specific raster icons, avoiding adaptive-icon masking.
          shutil.rmtree(root / "mipmap-anydpi-v26", ignore_errors=True)
          PY
          python - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          data = manifest.read_text(encoding="utf-8")
          match = re.search(r"<application\b[^>]*>", data, flags=re.S)
          if not match:
              raise SystemExit("Android application tag not found in manifest")
          tag = match.group(0)
          for attr in ("icon", "roundIcon"):
              tag = re.sub(rf'\s+android:{attr}="[^"]*"', "", tag)
          tag = tag[:-1] + ' android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round">'
          data = data[:match.start()] + tag + data[match.end():]
          manifest.write_text(data, encoding="utf-8")
          print("Launcher icon references configured:", manifest)
          PY

      - name: Verify launcher icon resources
        run: |
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          test ! -e android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: resident-manager-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Configure release signing
        id: release_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "::warning::Release signing secrets are not configured; skipping the optional signed release APK."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/modir-release.jks"
          test -s "$RUNNER_TEMP/modir-release.jks"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/release-signing.init.gradle" <<'GRADLE'
          allprojects { p ->
            p.plugins.withId('com.android.application') {
              p.android {
                signingConfigs {
                  release {
                    storeFile new File(System.getenv('RUNNER_TEMP'), 'modir-release.jks')
                    storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                    keyAlias System.getenv('ANDROID_KEY_ALIAS')
                    keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
                }
                buildTypes {
                  release {
                    signingConfig signingConfigs.release
                  }
                }
              }
            }
          }
          GRADLE

      - name: Build signed release APK
        if: steps.release_signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew -I "$RUNNER_TEMP/release-signing.init.gradle" assembleRelease --no-daemon

      - name: Verify signed release APK
        if: steps.release_signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          echo "Release APK files:"
          find android/app/build/outputs/apk/release -type f -name '*.apk' -print
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/resident-manager-release.apk

      - name: Upload signed release APK for Myket
        if: steps.release_signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resident-manager-release-apk
          path: dist/resident-manager-release.apk
          if-no-files-found: error
          retention-days: 30


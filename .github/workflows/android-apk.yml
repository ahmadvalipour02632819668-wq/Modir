name: Build Resident Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
      - "index.html"
      - "shell.js"
      - "app.css"
      - "manifest.webmanifest"
      - "icone.png"
      - "icone-192.png"
      - "icone-512.png"
      - "resident-manager-icon.svg"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare bundled web fallback
        run: |
          mkdir -p www
          cp index.html *.js *.css *.png *.svg manifest.webmanifest www/

      - name: Install dependencies
        run: npm install

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply official Resident Manager launcher icon
        run: |
          python -m pip install pillow cairosvg
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import cairosvg

          cairosvg.svg2png(url="resident-manager-icon.svg", write_to="/tmp/resident-manager-icon.png", output_width=512, output_height=512)
          src = Image.open("/tmp/resident-manager-icon.png").convert("RGBA")
          root = Path("android/app/src/main/res")
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for density,size in sizes.items():
              folder=root/f"mipmap-{density}"
              folder.mkdir(parents=True,exist_ok=True)
              icon=src.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(folder/"ic_launcher.png")
              icon.save(folder/"ic_launcher_round.png")
          drawable=root/"drawable"
          drawable.mkdir(parents=True,exist_ok=True)
          src.resize((432,432),Image.Resampling.LANCZOS).save(drawable/"ic_launcher_foreground.png")
          adaptive=root/"mipmap-anydpi-v26"
          adaptive.mkdir(parents=True,exist_ok=True)
          (adaptive/"ic_launcher.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">'
              '<background android:drawable="@color/ic_launcher_background"/>'
              '<foreground android:drawable="@drawable/ic_launcher_foreground"/>'
              '</adaptive-icon>',encoding="utf-8")
          (adaptive/"ic_launcher_round.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">'
              '<background android:drawable="@color/ic_launcher_background"/>'
              '<foreground android:drawable="@drawable/ic_launcher_foreground"/>'
              '</adaptive-icon>',encoding="utf-8")
          colors=root/"values"
          colors.mkdir(parents=True,exist_ok=True)
          (colors/"ic_launcher_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>'
              '<resources><color name="ic_launcher_background">#000000</color></resources>',
              encoding="utf-8")
          PY
          # Explicitly bind the Android application to the generated launcher icons.
          python - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          data = manifest.read_text(encoding="utf-8")
          match = re.search(r"<application\b[^>]*>", data, flags=re.S)
          if not match:
              raise SystemExit("Android application tag not found in manifest")
          tag = match.group(0)
          for attr in ("icon", "roundIcon"):
              tag = re.sub(rf'\s+android:{attr}="[^"]*"', "", tag)
          tag = tag[:-1] + ' android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round">'
          data = data[:match.start()] + tag + data[match.end():]
          manifest.write_text(data, encoding="utf-8")
          print("Launcher icon references configured:", manifest)
          PY

      - name: Verify launcher icon resources
        run: |
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -s android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: resident-manager-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "::error::Release signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub Actions secrets."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/modir-release.jks"
          test -s "$RUNNER_TEMP/modir-release.jks"
          cat > "$RUNNER_TEMP/release-signing.init.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
            allprojects { p ->
              if (p.plugins.hasPlugin('com.android.application')) {
                p.android {
                  signingConfigs {
                    release {
                      storeFile new File(System.getenv('RUNNER_TEMP'), 'modir-release.jks')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                    }
                  }
                  buildTypes {
                    release {
                      signingConfig signingConfigs.release
                    }
                  }
                }
              }
            }
          }
          GRADLE

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew -I "$RUNNER_TEMP/release-signing.init.gradle" assembleRelease --no-daemon

      - name: Upload signed release APK for Myket
        uses: actions/upload-artifact@v4
        with:
          name: resident-manager-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30


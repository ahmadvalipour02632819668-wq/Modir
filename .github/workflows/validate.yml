name: Validate frontend

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax-and-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          set -e
          for file in core.js shell.js dashboard.js community.js finance.js management.js navigation.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check local asset references and script order
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const expected = [
            'core.js', 'shell.js', 'dashboard.js', 'community.js',
            'finance.js', 'management.js', 'navigation.js'
          ];
          const actual = [...html.matchAll(/<script\s+src=["']\.\/([^"'?]+)(?:\?[^"']*)?["']/g)]
            .map(match => match[1])
            .filter(name => expected.includes(name));

          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            console.error('Unexpected JavaScript load order:', actual);
            process.exit(1);
          }

          for (const file of [...expected, 'app.css']) {
            if (!fs.existsSync(file)) {
              console.error('Missing referenced asset:', file);
              process.exit(1);
            }
          }

          console.log('JavaScript load order and local assets are valid.');
          NODE

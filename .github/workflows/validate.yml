name: Validate frontend

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax-and-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check all application JavaScript syntax
        run: |
          set -e
          for file in core.js icons.js menu-ui.js alert-ui.js alert-center.js sms.js media.js pwa.js assistant.js shell.js account-ui.js period-ui.js dashboard-ui.js dashboard.js community.js finance.js jalali-date.js management.js navigation.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check application structure and public API contracts
        run: node scripts/check-structure.mjs

      - name: Run frontend unit tests
        run: node --test tests/*.test.mjs

<script>
// Lightweight local Supabase client: this app uses only RPC and Edge Function calls.
window.supabase = window.supabase || {
  createClient: function (baseUrl, anonKey) {
    const headers = { apikey: anonKey, Authorization: 'Bearer ' + anonKey };
    async function request(url, options) {
      try {
        const response = await fetch(url, options);
        const raw = await response.text();
        let payload = null;
        try { payload = raw ? JSON.parse(raw) : null; } catch (_) { payload = raw; }
        if (!response.ok) {
          const detail = payload && typeof payload === 'object' ? payload : {};
          return { data: null, error: { message: detail.message || detail.msg || detail.error || ('HTTP ' + response.status), code: detail.code, details: detail.details, hint: detail.hint, status: response.status } };
        }
        return { data: payload, error: null };
      } catch (error) {
        return { data: null, error: { message: error.message || 'Network request failed', name: error.name || 'NetworkError' } };
      }
    }
    return {
      rpc: function (name, args, options) {
        return request((baseUrl.endsWith('/') ? baseUrl.slice(0, -1) : baseUrl) + '/rest/v1/rpc/' + encodeURIComponent(name), {
          method: 'POST',
          headers: Object.assign({}, headers, { 'Content-Type': 'application/json', Accept: 'application/json' }),
          body: JSON.stringify(args || {}),
          signal: options && options.signal
        });
      },
      functions: {
        invoke: function (name, options) {
          const opts = options || {};
          const extra = opts.headers || {};
          return request((baseUrl.endsWith('/') ? baseUrl.slice(0, -1) : baseUrl) + '/functions/v1/' + encodeURIComponent(name), {
            method: opts.method || 'POST',
            headers: Object.assign({}, headers, extra, { 'Content-Type': 'application/json' }),
            body: opts.body === undefined ? undefined : JSON.stringify(opts.body)
          });
        }
      }
    };
  }
};
</script>

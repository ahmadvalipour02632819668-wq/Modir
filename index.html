<!DOCTYPE html>

<head>

<style>
*{box-sizing:border-box;font-family:Vazirmatn,Tahoma}
body{margin:0;background:#f3f4f6;color:#111}
.wrap{max-width:480px;margin:0 auto;padding:16px;padding-bottom:80px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.06);margin-bottom:12px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid #26314f;border-radius:12px;margin:6px 0;font-size:15px}
button.main{width:100%;background:#232a5b;color:#fff;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;margin-top:10px;cursor:pointer}

nav{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid #ddd;display:flex;max-width:480px;margin:0 auto}

<body>
<div class="wrap"><div id="app"></div></div>
<nav id="bnav" style="display:none"></nav>
<script>
var SUPABASE_URL = 'https://gjuptvtddrtdydssgnih.supabase.co';
var SUPABASE_KEY = 'sb_publishable_0xCSGon56t3inyZt3rSkSg_mFf7bwH9';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

function $(s){ return document.querySelector(s); }
function tok(){ return sessionStorage.getItem('bm_token'); }
function me(){ try{ return JSON.parse(sessionStorage.getItem('bm_me')); }catch(e){ return null; } }

function toastErr(e){
  var m = '';
  if(e && e.message) m = e.message;
  else if(typeof e === 'string') m = e;
  else { try{ m = JSON.stringify(e); }catch(_){ m = 'خطا'; } }
  var d = document.createElement('div');
  d.className = 'err';
  d.textContent = m;
  document.getElementById('app').appendChild(d);
}

function num(v){
  if(v === '' || v === null || v === undefined) return null;
  var s = String(v);
  s = s.replace(/,/g, '');
  s = s.split('٬').join('');
  s = s.split(' ').join('');
  var n = Number(s);
  if(isNaN(n)) return null;
  return n;
}
function intval(v){
  var n = num(v);
  if(n === null) return null;
  return parseInt(n, 10);
}
function rpc(fn, args){
  return sb.rpc(fn, args).then(function(res){
    if(res.error) throw res.error;
    return res.data;
  });
}
function jalaliToday(){ try{ return new Date().toLocaleDateString('fa-IR'); }catch(e){ return ''; } }
function gregorianToJalali(g){ if(!g) return ''; try{ return new Date(g).toLocaleDateString('fa-IR'); }catch(e){ return g; } }

function showLogin(){
  document.getElementById('bnav').style.display = 'none';
  document.getElementById('app').innerHTML =
    '<div class="card"><h3 style="text-align:center">ورود / ثبت‌نام</h3>' +
    '<label>نام کاربری</label><input id="l_u">' +
    '<label>رمز</label><input id="l_p" type="password">' +
    '<button class="main" onclick="doLogin()">ورود</button>' +
    '<button class="main gray" onclick="showRegister()">ثبت‌نام</button>' +
    '<button class="main gray" onclick="showStatus()">پیگیری وضعیت ثبت‌نام</button>' +
    '<div id="msg"></div></div>';
}
function doLogin(){
  var u = document.getElementById('l_u').value.trim();
  var p = document.getElementById('l_p').value;
  rpc('app_login', { p_username: u, p_password: p }).then(function(d){
    sessionStorage.setItem('bm_token', d.token);
    sessionStorage.setItem('bm_me', JSON.stringify(d.me));
    afterLogin(d.me);
  }).catch(toastErr);
}
function showRegister(){
  rpc('app_public_buildings', {}).then(function(bl){
    if(!Array.isArray(bl)) bl = [];
    var opts = '<option value="">-- انتخاب --</option>';
    bl.forEach(function(b){ opts += '<option value="' + b.id + '">' + b.name + '</option>'; });
    document.getElementById('app').innerHTML =
      '<div class="card"><h3 style="text-align:center">ثبت‌نام</h3>' +
      '<label>نام کاربری</label><input id="r_u">' +
      '<label>رمز</label><input id="r_p" type="password">' +
      '<label>نام کامل</label><input id="r_n">' +
      '<label>موبایل</label><input id="r_ph">' +
      '<label>ایمیل</label><input id="r_e">' +
      '<label>نقش درخواستی</label><select id="r_role"><option value="resident">ساکن</option><option value="manager">مدیر ساختمان</option><option value="super_admin">ادمین</option></select>' +
      '<label>ساختمان (اگر ساکن هستید)</label><select id="r_b">' + opts + '</select>' +
      '<label>شماره واحد</label><input id="r_un" type="number">' +
      '<label>متراژ (مثال 100)</label><input id="r_ar" type="number" value="100">' +
      '<label>تعداد نفرات ساکن</label><input id="r_rc" type="number" value="4">' +
      '<label>نام ساختمان جدید (فقط مدیر ساختمان جدید)</label><input id="r_nb">' +
      '<label>تعداد واحد ساختمان جدید</label><input id="r_nbc" type="number">' +
      '<button class="main" onclick="doRegister()">ثبت‌نام</button>' +
      '<button class="main gray" onclick="showLogin()">برگشت</button></div>';
  }).catch(toastErr);
}
function doRegister(){
  var buildingId = document.getElementById('r_b').value;
  if(buildingId === '') buildingId = null;
  var unitNo = intval(document.getElementById('r_un').value);
  var area = num(document.getElementById('r_ar').value);
  if(area === null) area = 0;
  var rc = intval(document.getElementById('r_rc').value);
  if(rc === null) rc = 1;
  var nbc = intval(document.getElementById('r_nbc').value);
  if(nbc === null) nbc = 0;
  var payload = {
    p_username: document.getElementById('r_u').value.trim(),
    p_password: document.getElementById('r_p').value,
    p_full_name: document.getElementById('r_n').value || '',
    p_phone: document.getElementById('r_ph').value || '',
    p_email: document.getElementById('r_e').value || '',
    p_requested_role: document.getElementById('r_role').value,
    p_building_id: buildingId,
    p_unit_no: unitNo,
    p_area: area,
    p_resident_count: rc,
    p_new_building_name: document.getElementById('r_nb').value || '',
    p_new_building_unit_count: nbc
  };
  rpc('app_submit_registration', payload).then(function(){
    alert('درخواست ثبت شد، منتظر تایید بمانید');
    showLogin();
  }).catch(toastErr);
}
function showStatus(){
  document.getElementById('app').innerHTML =
    '<div class="card"><label>نام کاربری</label><input id="s_u">' +
    '<button class="main" onclick="checkStatus()">استعلام</button>' +
    '<button class="main gray" onclick="showLogin()">برگشت</button></div>';
}
function checkStatus(){
  var u = document.getElementById('s_u').value;
  rpc('app_check_registration_status', { p_username: u }).then(function(d){
    alert(JSON.stringify(d));
  }).catch(toastErr);
}

var DEFAULT_NAV = {
  super_admin: ['sa_dash','sa_buildings','sa_requests','admin_db','profile'],
  manager: ['m_dash','m_payments','m_expenses','m_units','m_requests','m_report','m_transfer','profile'],
  resident: ['r_dash','r_pay','r_charges','r_requests','profile']
};
var TITLES = { sa_dash:'داشبورد', sa_buildings:'ساختمان‌ها', sa_requests:'درخواست‌ها', admin_db:'دیتابیس', profile:'پروفایل', m_dash:'داشبورد مدیر', m_payments:'پرداخت‌ها', m_expenses:'هزینه‌ها', m_units:'واحدها', m_requests:'درخواست‌ها', m_report:'گزارش', m_transfer:'انتقال مدیریت', r_dash:'داشبورد', r_pay:'پرداخت', r_charges:'شارژها', r_requests:'درخواست‌ها' };

function afterLogin(m){
  if(m && m.must_change_password){
    document.getElementById('app').innerHTML =
      '<div class="card"><label>رمز جدید</label><input id="np" type="password">' +
      '<button class="main" onclick="changePass()">تغییر رمز</button></div>';
    return;
  }
  var role = m ? m.role : 'resident';
  var first = (DEFAULT_NAV[role] || DEFAULT_NAV.resident)[0];
  renderShell(first);
}
function changePass(){
  var v = document.getElementById('np').value;
  rpc('app_change_password', { p_token: tok(), p_new_password: v }).then(function(){
    location.reload();
  }).catch(toastErr);
}
function renderShell(view){
  var m = me();
  var role = m ? m.role : 'resident';
  var navs = DEFAULT_NAV[role] || DEFAULT_NAV.resident;
  var bn = document.getElementById('bnav');
  bn.style.display = 'flex';
  var html = '';
  navs.forEach(function(v){
    var cls = (v === view) ? 'on' : '';
    html += '<button class="' + cls + '" onclick="renderShell(\'' + v + '\')">' + (TITLES[v] || v) + '</button>';
  });
  bn.innerHTML = html;
  VIEWS[view]();
}

function approveAdminRequest(id, ok){
  rpc('app_admin_review_manager_request', { p_token: tok(), p_request_id: id, p_approve: ok }).then(function(){
    renderShell('sa_requests');
  }).catch(toastErr);
}
function approvePayment(id){
  rpc('app_manager_review_payment', { p_token: tok(), p_payment_id: id, p_approve: true }).then(function(){
    renderShell('m_payments');
  }).catch(toastErr);
}
function delExpense(id){
  rpc('app_manager_delete_transaction', { p_token: tok(), p_expense_id: id }).then(function(){
    renderShell('m_expenses');
  }).catch(toastErr);
}
function createExpense(){
  var t = document.getElementById('e_t').value;
  var a = num(document.getElementById('e_a').value);
  var d = document.getElementById('e_d').value;
  if(!d) d = new Date().toISOString().slice(0,10);
  rpc('app_manager_create_expense', { p_token: tok(), p_title: t, p_amount: a, p_date: d, p_tx_type: 'expense', p_category: 'عمومی' }).then(function(){
    alert('ثبت شد');
    renderShell('m_expenses');
  }).catch(toastErr);
}
function addUnit(){
  rpc('app_manager_add_unit_and_resident', {
    p_token: tok(),
    p_unit_no: Number(document.getElementById('u_n').value),
    p_area: Number(document.getElementById('u_a').value),
    p_resident_count: Number(document.getElementById('u_r').value),
    p_username: document.getElementById('u_u').value,
    p_password: document.getElementById('u_p').value,
    p_full_name: document.getElementById('u_f').value
  }).then(function(){ renderShell('m_units'); }).catch(toastErr);
}
function replyBuildingRequest(id){
  var v = document.getElementById('rp_' + id).value;
  rpc('app_manager_reply_building_request', { p_token: tok(), p_request_id: id, p_reply: v }).then(function(){
    renderShell('m_requests');
  }).catch(toastErr);
}
function doTransfer(){
  var u = document.getElementById('t_u').value;
  rpc('app_manager_transfer_management', { p_token: tok(), p_new_manager_username: u }).then(function(){
    alert('منتقل شد');
  }).catch(toastErr);
}
function submitPayment(){
  rpc('app_submit_itemized_payment', {
    p_token: tok(),
    p_amount: Number(document.getElementById('p_a').value),
    p_receipt_text: document.getElementById('p_r').value || ''
  }).then(function(){ alert('ثبت شد'); }).catch(toastErr);
}
function submitReq(){
  rpc('app_submit_building_request', {
    p_token: tok(),
    p_title: document.getElementById('n_t').value,
    p_body: document.getElementById('n_b').value || ''
  }).then(function(){ renderShell('r_requests'); }).catch(toastErr);
}
function doLogout(){
  rpc('app_logout', { p_token: tok() }).then(function(){
    sessionStorage.clear();
    showLogin();
  }).catch(function(){ sessionStorage.clear(); showLogin(); });
}
function saveReport(){
  var el = document.getElementById('rep');
  html2canvas(el).then(function(c){
    var a = document.createElement('a');
    a.href = c.toDataURL();
    a.download = 'report.png';
    a.click();
  });
}

  },

    rpc('app_admin_get_db_tables', { p_token: tok() }).then(function(t){
      document.getElementById('app').innerHTML = '<div class="card"><h4>جداول</h4><div>' + JSON.stringify(t) + '</div></div>';
    }).catch(toastErr);
  },
  m_dash: function(){
    rpc('app_manager_get_fund_summary', { p_token: tok() }).then(function(s){
      document.getElementById('app').innerHTML = '<div class="card"><h4>صندوق</h4><div>درآمد: ' + s.income + '</div><div>هزینه: ' + s.expense + '</div><div>مانده: ' + s.balance + '</div><div>امروز: ' + jalaliToday() + '</div></div>';
    }).catch(toastErr);
  },
  m_payments: function(){
    rpc('app_manager_list_pending_payments', { p_token: tok() }).then(function(p){
      var h = '<div class="card"><h4>در انتظار (' + p.length + ')</h4>';
      p.forEach(function(x){
        h += '<div>' + x.full_name + ' - ' + x.amount + ' <button class="small" onclick="approvePayment(\'' + x.id + '\')">تایید</button></div>';
      });
      h += '</div>';
      document.getElementById('app').innerHTML = h;
    }).catch(toastErr);
  },

    document.getElementById('app').innerHTML = h;
    rpc('app_manager_get_transactions', { p_token: tok() }).then(function(t){
      var h2 = '<div class="card"><table>';
      t.forEach(function(x){
        h2 += '<tr><td>' + x.title + '</td><td>' + x.amount + '</td><td>' + gregorianToJalali(x.date) + '</td><td><button class="small" onclick="delExpense(\'' + x.id + '\')">حذف</button></td></tr>';
      });
      h2 += '</table></div>';
      document.getElementById('lst').innerHTML = h2;
    }).catch(function(){});
  },
  m_units: function(){
    rpc('app_manager_list_building_members', { p_token: tok() }).then(function(m){
      var h = '<div class="card"><h4>واحدها</h4><table>';
      m.forEach(function(x){ h += '<tr><td>' + x.unit_no + '</td><td>' + x.full_name + '</td><td>' + x.unit_area + '</td></tr>'; });
      h += '</table><h4>افزودن واحد + ساکن</h4><input id="u_n" placeholder="شماره"><input id="u_a" placeholder="متراژ"><input id="u_r" placeholder="نفرات"><input id="u_u" placeholder="یوزر"><input id="u_p" placeholder="رمز"><input id="u_f" placeholder="نام"><button class="main" onclick="addUnit()">افزودن</button></div>';

  },
  r_charges: function(){
    rpc('app_resident_get_financial_summary', { p_token: tok() }).then(function(s){
      document.getElementById('app').innerHTML = '<div class="card">بدهی: ' + s.debt + ' - پرداخت: ' + s.paid + '</div>';

    var m = me();
    document.getElementById('app').innerHTML = '<div class="card">' + (m ? m.username : '') + '<br><button class="main" onclick="doLogout()">خروج</button></div>';

window.showRegister = showRegister;
window.showLogin = showLogin;

window.doRegister = doRegister;

window.renderShell = renderShell;
window.changePass = changePass;
window.approveAdminRequest = approveAdminRequest;
window.approvePayment = approvePayment;
window.delExpense = delExpense;
window.createExpense = createExpense;
window.addUnit = addUnit;
window.replyBuildingRequest = replyBuildingRequest;
window.doTransfer = doTransfer;
window.submitPayment = submitPayment;
window.submitReq = submitReq;
window.doLogout = doLogout;
window.saveReport = saveReport;

if(tok() && me()){
  var mm = me();
  var fl = (DEFAULT_NAV[mm.role] || DEFAULT_NAV.resident)[0];
  renderShell(fl);
} else {
  showLogin();
}
</script>
</body>
</html>

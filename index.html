const JALALI_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function gregorianToJalali(gy, gm, gd) {
  const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  let jy = (gy <= 1600) ? 0 : 979; gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365 * gy) + parseInt((gy2 + 3) / 4) - parseInt((gy2 + 99) / 100) + parseInt((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
  jy += 33 * parseInt(days / 12053); days %= 12053; jy += 4 * parseInt(days / 1461); days %= 1461;
  if (days > 365) { jy += parseInt((days - 1) / 365); days = (days - 1) % 365; }
  const jm = (days < 186) ? 1 + parseInt(days / 31) : 7 + parseInt((days - 186) / 30);
  const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
  return [jy, jm, jd];
}
function jalaliToGregorian(jy, jm, jd) {
  let gy = (jy <= 979) ? 621 : 1600; jy -= (jy <= 979) ? 0 : 979;
  let days = (365 * jy) + (parseInt(jy / 33) * 8) + parseInt(((jy % 33) + 3) / 4) + 78 + jd + ((jm < 7) ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
  gy += 400 * parseInt(days / 146097); days %= 146097;
  if (days > 36524) { gy += 100 * parseInt(--days / 36524); days %= 36524; if (days >= 365) days++; }
  gy += 4 * parseInt(days / 1461); days %= 1461;
  if (days > 365) { gy += parseInt((days - 1) / 365); days = (days - 1) % 365; }
  let gd = days + 1;
  const sal_a = [0, 31, ((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0)) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  let gm; for (gm = 0; gm < 13; gm++) { const v = sal_a[gm]; if (gd <= v) break; gd -= v; }
  return new Date(gy, gm - 1, gd, 12, 0, 0);
}
function jalaliMonthDays(jy, jm) { if (jm <= 6) return 31; if (jm <= 11) return 30; const isLeap = (((jy - 979) % 33) % 4) === 1; return isLeap ? 30 : 29; }
function openDatePicker(initialDate, onSelect) {
  let currentJ = initialDate ? gregorianToJalali(initialDate.getFullYear(), initialDate.getMonth() + 1, initialDate.getDate()) : jalaliToday();
  currentJ = { y: currentJ[0], m: currentJ[1], d: currentJ[2] };
  const m = modal(`
    <h2 style="text-align:center;margin-bottom:20px">انتخاب تاریخ</h2>
    <div class="dp-header"><button type="button" class="dp-nav" id="dp-prev">‹</button><div class="dp-month-year" id="dp-title"></div><button type="button" class="dp-nav" id="dp-next">›</button></div>
    <div class="dp-weekdays"><div>ش</div><div>ی</div><div>د</div><div>س</div><div>چ</div><div>پ</div><div>ج</div></div>
    <div class="dp-calendar" id="dp-grid"></div>
    <div style="display:flex; gap:10px; margin-top:24px;"><button class="btn lt" id="dp-today" style="flex:1">امروز</button><button class="btn" id="dp-close" style="flex:1">بستن</button></div>
  `);
  const renderCalendar = () => {
    $('#dp-title', m).textContent = `${JALALI_MONTHS[currentJ.m - 1]} ${fa(currentJ.y)}`;
    const grid = $('#dp-grid', m); grid.innerHTML = '';
    const firstDayG = jalaliToGregorian(currentJ.y, currentJ.m, 1);
    let startDow = (firstDayG.getDay() + 1) % 7;
    const daysInMonth = jalaliMonthDays(currentJ.y, currentJ.m);
    const todayJ = jalaliToday();
    for (let i = 0; i < startDow; i++) grid.innerHTML += `<div class="dp-day dp-empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = (currentJ.y === todayJ.y && currentJ.m === todayJ.m && d === todayJ.d);
      const isSelected = (currentJ.y === currentJ.selectedY && currentJ.m === currentJ.selectedM && d === currentJ.selectedD);
      let cls = 'dp-day'; if (isToday) cls += ' dp-today'; if (isSelected) cls += ' dp-selected';
      grid.innerHTML += `<div class="${cls}" data-day="${d}">${fa(d)}</div>`;
    }
    $$('.dp-day:not(.dp-empty)', grid).forEach(el => {
      el.addEventListener('click', () => {
        currentJ.selectedY = currentJ.y; currentJ.selectedM = currentJ.m; currentJ.selectedD = +el.dataset.day;
        onSelect(jalaliToGregorian(currentJ.selectedY, currentJ.selectedM, currentJ.selectedD)); m.remove();
      });
    });
  };
  $('#dp-prev', m).addEventListener('click', () => { currentJ.m--; if (currentJ.m < 1) { currentJ.m = 12; currentJ.y--; } renderCalendar(); });
  $('#dp-next', m).addEventListener('click', () => { currentJ.m++; if (currentJ.m > 12) { currentJ.m = 1; currentJ.y++; } renderCalendar(); });
  $('#dp-today', m).addEventListener('click', () => { const t = jalaliToday(); onSelect(jalaliToGregorian(t.y, t.m, t.d)); m.remove(); });
  $('#dp-close', m).addEventListener('click', () => m.remove());
  if (initialDate) { const ij = gregorianToJalali(initialDate.getFullYear(), initialDate.getMonth() + 1, initialDate.getDate()); currentJ.selectedY = ij[0]; currentJ.selectedM = ij[1]; currentJ.selectedD = ij[2]; }
  else { currentJ.selectedY = currentJ.y; currentJ.selectedM = currentJ.m; currentJ.selectedD = currentJ.d; }
  renderCalendar();
}
function bindDatePickers(root = document) {
  $$('.date-picker-input', root).forEach(input => {
    if (input.dataset.dpBound) return; input.dataset.dpBound = '1';
    if (input.value) {
      const parts = input.value.split('-');
      if (parts.length === 3) {
        const g = new Date(+parts[0], +parts[1] - 1, +parts[2]);
        const j = gregorianToJalali(g.getFullYear(), g.getMonth() + 1, g.getDate());
        input.value = `${j[0]}/${String(j[1]).padStart(2,'0')}/${String(j[2]).padStart(2,'0')}`;
        input.dataset.gregorian = `${parts[0]}-${parts[1]}-${parts[2]}`;
      }
    } else {
      const t = jalaliToday();
      input.value = `${t.y}/${String(t.m).padStart(2,'0')}/${String(t.d).padStart(2,'0')}`;
      const todayG = new Date();
      input.dataset.gregorian = `${todayG.getFullYear()}-${String(todayG.getMonth()+1).padStart(2,'0')}-${String(todayG.getDate()).padStart(2,'0')}`;
    }
    input.addEventListener('click', () => {
      let initDate = new Date();
      if (input.dataset.gregorian) { const p = input.dataset.gregorian.split('-'); initDate = new Date(+p[0], +p[1] - 1, +p[2]); }
      openDatePicker(initDate, (gDate) => {
        const j = gregorianToJalali(gDate.getFullYear(), gDate.getMonth() + 1, gDate.getDate());
        input.value = `${j[0]}/${String(j[1]).padStart(2,'0')}/${String(j[2]).padStart(2,'0')}`;
        input.dataset.gregorian = `${gDate.getFullYear()}-${String(gDate.getMonth()+1).padStart(2,'0')}-${String(gDate.getDate()).padStart(2,'0')}`;
        input.dispatchEvent(new Event('change', { bubbles: true }));
      });
    });
  });
}

        <label class="f">متراژ واحد<input id="rg-area" type="number" min="1" step="0.01" required></label>
        ${needsResidentCount ? `<label class="f">تعداد نفرات ساکن<input id="rg-res-count" type="number" min="1" required></label>` : ''}
      `}
      <button class="btn" type="submit" id="rg-btn">ثبت‌نام</button>
      <p id="rg-err" style="color:var(--danger);margin:0;min-height:22px"></p>
    </form>`;
  $('#reg-back').addEventListener('click', () => renderRegisterForm());
  if (isManager) {

    sel.addEventListener('change', toggle); toggle();
  }
  $('#rf').addEventListener('submit', async e => {
    e.preventDefault(); $('#rg-err').textContent = '';
    const pwd = $('#rg-pass').value;
    if (!isStrongPwd(pwd)) { $('#rg-err').textContent = PWD_HINT; return; }
    const btn = $('#rg-btn'), old = btn.textContent; btn.disabled = true; btn.textContent = 'در حال ارسال...';

function showNavSettingsModal(roleKey, allButtons) {
  const currentKeys = getSavedNav(roleKey);
  const buttonKeys = Object.keys(allButtons);
  
  let checkboxesHtml = buttonKeys.map(k => {
    const isChecked = currentKeys.includes(k);
    return `
      <label style="display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line);cursor:pointer">
        <input type="checkbox" value="${k}" class="nav-check" ${isChecked ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--navy)">
        <span style="font-size:16px">${allButtons[k].icon}</span>
        <span style="font-size:14px;font-weight:700">${allButtons[k].label}</span>
      </label>
    `;
  }).join('');

  const m = modal(`
    <h2>تنظیمات منوی پایین</h2>
    <p class="sub">حداکثر ۵ گزینه را برای نمایش در منوی پایین انتخاب کنید. (پیشنهاد می‌شود ۴ یا ۵ گزینه باشد)</p>
    <div style="max-height:50vh;overflow-y:auto;margin-bottom:20px;background:var(--card);border-radius:12px;border:1px solid var(--line)">
      ${checkboxesHtml}
    </div>
    <button class="btn" id="save-nav-btn" style="width:100%">ذخیره تغییرات</button>
  `);

  $('#save-nav-btn', m).addEventListener('click', () => {
    const selected = [];
    $$('.nav-check', m).forEach(cb => { if (cb.checked) selected.push(cb.value); });
    
    if (selected.length < 3) { toastErr('حداقل ۳ گزینه را انتخاب کنید'); return; }
    if (selected.length > 5) { toastErr('حداکثر ۵ گزینه قابل انتخاب است'); return; }
    
    saveNav(roleKey, selected);
    m.remove();
    toastOk('منو با موفقیت تغییر کرد');
    renderShell();
  });
}

async function go(v) {
  if (!VIEWS[v]) v = S.me?.is_superadmin ? 'sa_dash' : isManager() ? 'm_dash' : 'r_dash';
  S.view = v;
  const el = $('#view'); if (!el) return;
  el.innerHTML = `<p class="sub">در حال بارگذاری...</p>`;
  renderHeaderState();
  const rid = ++S.renderId;
  try { 
    await VIEWS[v](el); 
    requestAnimationFrame(() => { requestAnimationFrame(() => { if(rid === S.renderId) renderHeaderState(); }); });
  } catch (e) {
    if (rid !== S.renderId) return;
    if (e.message === 'NETWORK_ERROR') {
      el.innerHTML = `<div class="empty"><div class="ico">📡</div><h2>اتصال به سرور برقرار نیست</h2><p>لطفاً اینترنت را بررسی کنید</p><button class="btn" id="retry">تلاش مجدد</button></div>`;
      $('#retry', el).addEventListener('click', () => go(v)); return;
    }
    if (/نشست|session|invalid|unauthorized|منقضی/i.test(e.message)) { toastErr('نشست منقضی شده است'); setTimeout(() => doLogout(true), 1200); return; }
    showErr(e); el.innerHTML = `<div class="card" style="color:var(--danger)">خطا: ${esc(e.message)}</div>`;
  }
}

async function loadTableData(tableName, el) {
  const content = $('#db-table-content', el);
  content.innerHTML = '<p class="sub">در حال بارگذاری دیتای جدول...</p>';

  try {
    const data = await T('app_admin_get_table_data', { p_table_name: tableName });
    
    if (!data || data.length === 0) {
      content.innerHTML = `<div class="card"><h2 dir="ltr">${esc(tableName)}</h2><p class="sub">این جدول خالی است.</p></div>`;
      return;
    }

    const columns = Object.keys(data[0]).filter(c => !SENS_COLS.some(s => c.toLowerCase().includes(s)));

    content.innerHTML = `
      <div class="card" style="padding:0;overflow:hidden">
        <div style="padding:16px;border-bottom:1px solid var(--line);background:var(--bg)">
          <h2 style="margin:0;direction:ltr">جدول: ${esc(tableName)}</h2>
          <small class="sub">${fa(data.length)} رکورد نمایش داده شده</small>
        </div>
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                ${columns.map(c => `<th dir="ltr">${esc(c)}</th>`).join('')}
              </tr>
            </thead>
            <tbody>
              ${data.map(row => `
                <tr>
                  ${columns.map(c => {
                    let val = row[c];
                    if (val === null) val = 'NULL';
                    if (typeof val === 'object') val = JSON.stringify(val);
                    return `<td dir="ltr" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(val)}">${esc(val)}</td>`;
                  }).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  } catch (e) {
    content.innerHTML = `<div class="card" style="color:var(--danger)">خطا: ${esc(e.message)}</div>`;
  }
}

function newExpenseModal(bid, members) {
  const m = modal(`
    <h2>ثبت هزینه جدید</h2>
    <form id="nef" class="grid" style="gap:14px">
      <label class="f">شرح هزینه<input id="ne-desc" placeholder="مثلاً شارژ آبان..." required></label>
      <label class="f">مبلغ (تومان)<input id="ne-amount" inputmode="numeric" required></label>
      <label class="f">تاریخ<input id="ne-date" class="date-picker-input" readonly placeholder="انتخاب تاریخ" required></label>
      <label class="f">روش تسهیم
        <select id="ne-method">
          <option value="none">بدون تسهیم</option>
          <option value="fixed">مبلغ ثابت برای همه (مثل شارژ)</option>
          <option value="equal">مساوی بین همه</option>
          <option value="area">بر اساس متراژ</option>
          <option value="residents">بر اساس تعداد ساکنین</option>
          <option value="manual">دستی</option>
        </select>
      </label>
      <div id="ne-alloc-wrap" style="display:none"><label class="f" style="margin-bottom:8px">مسئولین پرداخت (تیک افراد غیرمسئول را بردارید)</label><div id="ne-alloc-list" style="margin-top:8px"></div></div>
      <button class="btn" type="submit">ثبت هزینه</button>
    </form>`);
  bindDatePickers(m);
  const methodSel = $('#ne-method', m), wrap = $('#ne-alloc-wrap', m), listEl = $('#ne-alloc-list', m);
  const buildAllocList = () => {
    const method = methodSel.value;
    if (method === 'none') { wrap.style.display = 'none'; return; }
    wrap.style.display = '';
    listEl.innerHTML = members.map(x => `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)"><input type="checkbox" class="alloc-check" data-mid="${x.membership_id}" checked style="width:18px;height:18px;accent-color:var(--navy)"><span style="flex:1;font-size:13px">${esc(x.full_name)} <small style="color:var(--muted)">(واحد ${fa(x.unit_no)})</small></span>${method === 'manual' ? `<input type="text" class="alloc-amount" inputmode="numeric" placeholder="مبلغ" style="width:120px;min-height:36px;padding:4px 8px">` : ''}</div>`).join('');
    attachNumericInputIn(listEl, '.alloc-amount');
  };
  methodSel.addEventListener('change', buildAllocList); buildAllocList();
  
  $('#nef', m).addEventListener('submit', async e => {
    e.preventDefault();
    const method = methodSel.value, amount = toNum($('#ne-amount', m).value);
    if (amount <= 0) { toastErr('مبلغ باید بیشتر از صفر باشد'); return; }
    
    let allocations = [];
    if (method !== 'none') {
      $$('.alloc-check', m).forEach(cb => {
        if (cb.checked) {
          const item = { membership_id: cb.dataset.mid };
          // اگر روش "مبلغ ثابت" انتخاب شده بود، مبلغ وارد شده برابر با سهم هر نفر است
          if (method === 'manual') { 
            const amtInput = cb.parentElement.querySelector('.alloc-amount'); 
            item.amount = toNum(amtInput.value); 
            if (item.amount <= 0) return; 
          } else if (method === 'fixed') { 
            item.amount = amount; 
          }
          allocations.push(item);
        }
      });
      if (allocations.length === 0) { toastErr('حداقل یک مسئول پرداخت انتخاب کنید'); return; }
    }
    
    // محاسبه مبلغ کل نهایی برای فرستادن به دیتابیس (در حالت مبلغ ثابت، مبلغ در تعداد افراد ضرب می‌شود)
    let totalAmountToSend = amount;
    if (method === 'fixed') {
        totalAmountToSend = amount * allocations.length;
    }

    try { 
      await T('app_manager_create_expense', { 
        p_building_id: bid, 
        p_description: $('#ne-desc', m).value, 
        p_amount: totalAmountToSend, 
        p_expense_date: $('#ne-date', m).dataset.gregorian || $('#ne-date', m).value, 
        // روش در دیتابیس "دستی" فرستاده می‌شود چون خودمان مبلغ هر نفر را محاسبه و ارسال کردیم
        p_allocation_method: method === 'fixed' ? 'manual' : method, 
        p_allocations: allocations 
      }); 
      m.remove(); 
      toastOk('هزینه ثبت شد'); 
      go('m_expenses'); 
    } catch (err) { showErr(err); }
  });
}

    try {
      const g = jalaliToGregorian(y, mo, 1);
      const r = await T('app_manager_get_monthly_report', { p_building_id: bid, p_year: g.getFullYear(), p_month: g.getMonth() + 1 });
      const membersRes = await T('app_manager_list_building_members', { p_building_id: bid });
      const members = membersRes.members || [];
      const balances = await T('app_manager_get_member_balances', { p_building_id: bid }).catch(()=>null);

      const monthExpenses = r.expenses || [];
      const activeCategories = [];
      const catMap = { charge: 'شارژ ماهیانه', water: 'قبض آب', gas: 'قبض گاز', electric: 'قبض برق', repair: 'بازسازی', parking: 'اجاره پارکینگ' };
      
      monthExpenses.forEach(e => {
          let cat = 'other';
          if (e.description.includes('شارژ')) cat = 'charge';
          else if (e.description.includes('آب')) cat = 'water';
          else if (e.description.includes('گاز')) cat = 'gas';
          else if (e.description.includes('برق')) cat = 'electric';
          else if (e.description.includes('بازسازی')) cat = 'repair';
          else if (e.description.includes('پارکینگ')) cat = 'parking';
          
          if (!activeCategories.includes(cat) && cat !== 'other') activeCategories.push(cat);
      });

      let headerCols = `<th style="background-color:#D9E1F2; border:1px solid #333; padding:8px; color:#000; font-size:20px; font-weight:bold;">واحد</th>`;
      activeCategories.forEach(cat => { headerCols += `<th style="background-color:#D9E1F2; border:1px solid #333; padding:8px; color:#000; font-size:20px; font-weight:bold;">${catMap[cat]}</th>`; });
      headerCols += `<th style="background-color:#D9E1F2; border:1px solid #333; padding:8px; color:#000; font-size:20px; font-weight:bold;">جمع مبلغ<br>قابل پرداخت</th>`;

      let tableRows = '';
      members.filter(x => x.access_role === 'resident' && x.membership_status === 'active').forEach(mem => {
          const unitNo = mem.unit_no || '—';
          const rType = RESIDENT_TYPES[mem.resident_type] || '';
          const memBalance = balances?.members?.find(x => x.membership_id === mem.membership_id);
          const remaining = memBalance?.outstanding_debt || 0;
          
          let rowBg = '#ffffff'; let textColor = '#000000';
          if (remaining <= 0) { rowBg = '#00B050'; textColor = '#ffffff'; }
          else if (remaining > 0) { rowBg = '#FFC000'; textColor = '#000000'; }

          let rowHtml = `<tr style="background-color:${rowBg}; color:${textColor};"><td style="border:1px solid #333; padding:10px; text-align:center; font-size:20px; font-weight:bold;">واحد ${fa(unitNo)}<br><span style="font-size:13px; font-weight:normal; opacity:0.8;">${esc(rType)}</span></td>`;

          activeCategories.forEach(cat => {
              const catExpenses = monthExpenses.filter(e => {
                  if (cat === 'charge' && e.description.includes('شارژ')) return true;
                  if (cat === 'water' && e.description.includes('آب')) return true;
                  if (cat === 'gas' && e.description.includes('گاز')) return true;
                  if (cat === 'electric' && e.description.includes('برق')) return true;
                  if (cat === 'repair' && e.description.includes('بازسازی')) return true;
                  if (cat === 'parking' && e.description.includes('پارکینگ')) return true;
                  return false;
              });
              const totalCatAmount = catExpenses.reduce((sum, e) => sum + e.amount, 0);
              const memberCount = members.filter(x => x.access_role === 'resident' && x.membership_status === 'active').length || 1;
              const perUnit = totalCatAmount / memberCount;
              rowHtml += `<td style="border:1px solid #333; padding:10px; text-align:center; font-size:24px; font-weight:bold;">${perUnit > 0 ? fmt(perUnit) : '—'}</td>`;
          });

          rowHtml += `<td style="border:1px solid #333; padding:10px; text-align:center; font-size:24px; font-weight:bold;">${remaining <= 0 ? 'تسویه' : fmt(remaining)}</td></tr>`;
          tableRows += rowHtml;
      });

      if (!tableRows) tableRows = `<tr><td colspan="${activeCategories.length + 2}" style="text-align:center; padding:20px; font-size:20px; font-weight:bold;">اطلاعاتی برای این دوره وجود ندارد.</td></tr>`;

      body.innerHTML = `
        <div id="printable-area" style="border-radius:8px; overflow-x:auto; border:1px solid #333; background:#fff; width:100%; box-sizing:border-box; padding: 4px;">
          <table style="width:100%; border-collapse:collapse; font-size:14px; text-align:center; direction:rtl; border:2px solid #000;">
            <thead>
              <tr><th colspan="${activeCategories.length + 2}" style="background-color:#7A9CBE; color:white; padding:12px; font-size:24px; font-weight:bold; border:1px solid #333;">گزارش ${MONTHS[mo-1]} ماه - ${fa(y)}/${String(mo).padStart(2, '0')}</th></tr>
              <tr>${headerCols}</tr>
            </thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
        <div class="no-print" style="margin-top:16px; display:flex; justify-content:space-around; text-align:center; flex-wrap:wrap; gap:10px; background: var(--card); padding: 16px; border-radius: 16px;">
          <div><small class="sub">کل دریافتی ماه</small><div style="font-weight:900; color:var(--success)">${fmt(r.month_income)} تومان</div></div>
          <div><small class="sub">کل هزینه ماه</small><div style="font-weight:900; color:var(--danger)">${fmt(r.month_expenses)} تومان</div></div>
          <div><small class="sub">موجودی صندوق</small><div style="font-weight:900; color:var(--navy)">${fmt(r.fund_balance_to_month_end)} تومان</div></div>
        </div>
      `;

      $('#pr-btn', el).addEventListener('click', () => window.print());
      $('#img-btn', el).addEventListener('click', async () => {
        try {
          toastOk('در حال آماده‌سازی عکس...');
          const element = $('#printable-area', el);
          const canvas = await html2canvas(element, { scale: 2, backgroundColor: '#ffffff' });
          const link = document.createElement('a');
          link.download = `گزارش-${MONTHS[mo-1]}-${y}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        } catch (err) { showErr(new Error('خطا در گرفتن عکس: ' + err.message)); }
      });

    } catch (err) { body.innerHTML = `<div class="card" style="color:var(--danger)">خطا در دریافت گزارش: ${esc(err.message)}</div>`; }
  };

  $('#rp-year', el).addEventListener('change', loadReport);
  $('#rp-month', el).addEventListener('change', loadReport);
  loadReport();
}

async function viewResidentDash(el) {
  const m = currentMembership(); if (!m) return;
  let summary = null, err = null;
  try { summary = await T('app_resident_get_financial_summary', { p_building_id: m.building_id, p_membership_id: m.membership_id }); } catch (e) { err = e.message; }
  if (err && /not been configured|ثبت نشده/i.test(err)) { el.innerHTML = `<h1>خانه</h1><p class="sub">${esc(m.building_name)}</p><div class="card" style="background:#fef3c7;color:#92400e"><h2 style="margin:0 0 8px">⏳ تنظیمات مالی هنوز انجام نشده</h2><p style="margin:0">مدیر ساختمان هنوز تنظیمات مالی را ثبت نکرده است.</p></div>`; return; }
  const debt = summary?.debt_balance || 0, credit = summary?.credit_balance || 0, pending = summary?.pending_payments || 0;
  el.innerHTML = `
    <h1>سلام ${esc(m.full_name || '')} 👋</h1><p class="sub">${esc(m.building_name)} · واحد ${fa(summary?.unit_no || '')} · ${RESIDENT_TYPES[summary?.resident_type] || ''}</p>
    <div class="bank-card" style="margin-bottom:24px"><b>وضعیت حساب شما</b><div class="bc-row"><span>مانده قابل پرداخت (تومان)</span></div><div class="bc-row" style="margin-top:4px"><span class="bc-amt" style="color:${debt > 0 ? '#ffb3b3' : credit > 0 ? '#b3f5c4' : '#fff'}">${debt > 0 ? fmt(debt) : credit > 0 ? 'بستانکار ' + fmt(credit) : 'تسویه'}</span></div><div class="bc-row" style="margin-top:14px"><span>پرداخت‌های در انتظار: ${fmt(pending)} تومان</span>${debt > 0 ? `<button class="pill" id="go-pay">💸 پرداخت بدهی</button>` : ''}</div></div>
    <div class="sec-title" style="margin-top:0">دسترسی سریع</div>
    <div class="grid" style="grid-template-columns:repeat(4, 1fr); gap:8px; margin-bottom:24px;">
      ${[['r_pay', 'پرداخت', '💸'], ['r_charges', 'صورتحساب', '📄'], ['r_requests', 'درخواست‌ها', '💬'], ['profile', 'پروفایل', '👤']].map(([k, l, ic]) => `<button class="card" data-go="${k}" style="cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:12px 4px;gap:8px;border:0;text-align:center"><div style="font-size:24px">${ic}</div><b style="font-size:11px;white-space:nowrap">${l}</b></button>`).join('')}
    </div>
    ${summary?.charges?.length ? `<div class="sec-title">آخرین صورتحساب‌ها</div><div class="grid">${summary.charges.slice(0, 5).map(c => `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:6px"><b>${esc(c.description)}</b><b>${fmt(c.amount)} تومان</b></div><div class="sub" style="margin:0">تاریخ: ${esc(c.item_date)} · ${c.item_type === 'expense' ? 'هزینه' : 'بدهی اولیه'}</div></div>`).join('')}</div>` : ''}`;
  $$('[data-go]', el).forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  $('#go-pay', el)?.addEventListener('click', () => go('r_pay'));
}
async function viewResidentCharges(el) {
  const m = currentMembership(); if (!m) return;
  const s = await T('app_resident_get_financial_summary', { p_building_id: m.building_id, p_membership_id: m.membership_id });
  const charges = s.charges || [], payments = s.payments || [];
  el.innerHTML = `<h1>صورتحساب</h1><p class="sub">${esc(m.building_name)} · واحد ${fa(s.unit_no)}</p><div class="grid g3" style="margin-bottom:20px"><div class="card"><small class="sub">جمع بدهی</small><div style="font-size:22px;font-weight:900;color:var(--danger)">${fmt(s.debt_balance)}</div></div><div class="card"><small class="sub">بستانکاری</small><div style="font-size:22px;font-weight:900;color:var(--success)">${fmt(s.credit_balance)}</div></div><div class="card"><small class="sub">در انتظار تایید</small><div style="font-size:22px;font-weight:900;color:var(--warning)">${fmt(s.pending_payments)}</div></div></div><div class="sec-title">اقلام صورتحساب</div>${charges.length ? `<div class="tbl-wrap" style="margin-bottom:20px"><table><thead><tr><th>شرح</th><th>مبلغ</th><th>تاریخ</th><th>نوع</th></tr></thead><tbody>${charges.map(c => `<tr><td>${esc(c.description)}</td><td>${fmt(c.amount)}</td><td>${esc(c.item_date)}</td><td>${c.item_type === 'expense' ? '<span class="chip ex">هزینه</span>' : '<span class="chip pd">بدهی اولیه</span>'}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty"><p>صورتحسابی ثبت نشده</p></div>`}<div class="sec-title">سابقه پرداخت‌ها</div>${payments.length ? `<div class="tbl-wrap"><table><thead><tr><th>مبلغ</th><th>وضعیت</th><th>تاریخ</th></tr></thead><tbody>${payments.map(p => `<tr><td>${fmt(p.amount)}</td><td>${p.status === 'approved' ? '<span class="chip ok">تایید</span>' : p.status === 'pending' ? '<span class="chip pd">در انتظار</span>' : p.status === 'rejected' ? '<span class="chip no">رد</span>' : '<span class="chip ex">' + esc(p.status) + '</span>'}</td><td>${esc(p.payment_date)}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty"><p>پرداختی ثبت نشده</p></div>`}`;
}
async function viewResidentPay(el) {
  const m = currentMembership(); if (!m) return;
  const s = await T('app_resident_get_financial_summary', { p_building_id: m.building_id, p_membership_id: m.membership_id });
  const charges = s.charges || [];
  el.innerHTML = `<h1>پرداخت</h1><p class="sub">${esc(m.building_name)} · واحد ${fa(s.unit_no)}</p>${charges.length ? `<form id="pay-form" class="card"><h2>انتخاب اقلام پرداختی</h2><p class="sub">تیک بزنید و مبلغ هر آیتم را بررسی کنید.</p><div id="pay-list" style="margin:16px 0">${charges.map(c => `<div class="debt-row" data-item-id="${c.id}" data-item-type="${c.item_type}"><input type="checkbox" class="pay-check" checked><span style="flex:1;font-weight:700">${esc(c.description)}</span><input type="text" class="pay-amount" inputmode="numeric" value="${fmt(c.amount)}"><span style="font-size:11px;color:var(--muted)">تومان</span></div>`).join('')}</div><div class="card" style="background:var(--bg);margin-bottom:14px;display:flex;justify-content:space-between;padding:14px 18px"><b>جمع انتخاب‌شده:</b><b id="pay-total" style="color:var(--navy)">0 تومان</b></div><div class="grid g2" style="gap:14px"><label class="f">تاریخ پرداخت<input id="pay-date" class="date-picker-input" readonly placeholder="انتخاب تاریخ" required></label><label class="f">توضیحات (اختیاری)<input id="pay-note" placeholder="مثلاً: فیش بانکی"></label></div><button class="btn" type="submit" style="margin-top:14px;width:100%">ثبت پرداخت</button></form>` : `<div class="empty"><div class="ico">✅</div><p>بدهی برای پرداخت وجود ندارد</p></div>`}`;
  if (!charges.length) return;
  $$('.pay-amount', el).forEach(inp => inp.addEventListener('input', e => { const n = toNum(e.target.value); e.target.value = n ? fmt(n) : ''; }));
  bindDatePickers(el);
  const updateTotal = () => { let total = 0; $$('.debt-row', el).forEach(row => { if ($('.pay-check', row).checked) total += toNum($('.pay-amount', row).value); }); $('#pay-total', el).textContent = fmt(total) + ' تومان'; };
  $$('.pay-check, .pay-amount', el).forEach(x => x.addEventListener('input', updateTotal)); updateTotal();
  $('#pay-form', el).addEventListener('submit', async e => {
    e.preventDefault();
    const allocations = [];
    $$('.debt-row', el).forEach(row => { const cb = $('.pay-check', row); if (!cb.checked) return; const amount = toNum($('.pay-amount', row).value); if (amount <= 0) return; allocations.push({ type: row.dataset.itemType, id: row.dataset.itemId, amount }); });
    if (!allocations.length) { toastErr('حداقل یک آیتم انتخاب کنید'); return; }
    const total = allocations.reduce((s, a) => s + a.amount, 0);
    try { await T('app_submit_itemized_payment', { p_building_id: m.building_id, p_membership_id: m.membership_id, p_payment_date: $('#pay-date', el).dataset.gregorian || $('#pay-date', el).value, p_description: $('#pay-note', el).value || null, p_allocations: allocations, p_total_amount: total }); toastOk('پرداخت ثبت شد'); go('r_dash'); } catch (err) { showErr(err); }
  });
}
async function viewResidentRequests(el) {
  const m = currentMembership(); if (!m) return;
  const list = await T('app_resident_list_building_requests', { p_building_id: m.building_id, p_membership_id: m.membership_id });
  const statusChip = s => { if (s === 'resolved') return '<span class="chip ok">انجام شد</span>'; if (s === 'answered') return '<span class="chip ok">پاسخ داده شد</span>'; if (s === 'in_progress') return '<span class="chip pd">در حال بررسی</span>'; if (s === 'rejected') return '<span class="chip no">رد شد</span>'; return '<span class="chip ex">جدید</span>'; };
  el.innerHTML = `<h1>درخواست‌ها</h1><p class="sub">ثبت و پیگیری درخواست‌ها</p><form id="rf" class="card" style="margin-bottom:20px"><h2>ثبت درخواست جدید</h2><div class="grid" style="gap:14px"><label class="f">نوع درخواست<select id="rf-type"><option value="repair">درخواست تعمیر</option><option value="suggestion">انتقاد و پیشنهاد</option><option value="complaint">شکایت</option><option value="other">سایر</option></select></label><label class="f">عنوان<input id="rf-title" required minlength="3" maxlength="150"></label><label class="f">توضیحات<textarea id="rf-desc" rows="3" required minlength="3" maxlength="5000"></textarea></label><button class="btn" type="submit">ارسال به مدیر</button></div></form><div class="sec-title">سابقه درخواست‌ها</div>${list.length ? list.map(r => `<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap"><b>${esc(r.title)}</b>${statusChip(r.request_status)}</div><div class="sub" style="margin:0 0 8px">${REQ_TYPES[r.request_type] || r.request_type}</div><p style="margin:0 0 10px;white-space:pre-wrap">${esc(r.description)}</p>${r.manager_reply ? `<div style="background:var(--bg);border-right:3px solid var(--peach);padding:10px 14px;border-radius:10px"><div class="sub" style="margin:0 0 4px">پاسخ مدیر:</div><div style="white-space:pre-wrap">${esc(r.manager_reply)}</div></div>` : ''}</div>`).join('') : `<div class="empty"><div class="ico">📭</div><p>درخواستی ثبت نکرده‌اید</p></div>`}`;
  $('#rf', el).addEventListener('submit', async e => { e.preventDefault(); try { await T('app_submit_building_request', { p_building_id: m.building_id, p_membership_id: m.membership_id, p_request_type: $('#rf-type', el).value, p_title: $('#rf-title', el).value, p_description: $('#rf-desc', el).value }); toastOk('ارسال شد'); go('r_requests'); } catch (err) { showErr(err); } });
}

function viewServices(el) {
  const isAdmin = S.me.is_superadmin, mgr = isManager();
  let items = [];
  if (isAdmin) { items = [['sa_buildings', 'ساختمان‌ها', '🏢'], ['sa_requests', 'درخواست مدیران', '👥'], ['sa_profile', 'پروفایل', '👤']]; }
  else if (mgr) { items = [['m_units', 'واحدها و ساکنین', '👥'], ['m_expenses', 'هزینه‌ها', '💸'], ['m_payments', 'تایید پرداخت', '✅'], ['m_requests_pending', 'تایید ثبت‌نام', '📝'], ['m_transfer', 'انتقال مدیریت', '🔄'], ['m_rates', 'تنظیمات مالی', '⚙️'], ['m_report', 'گزارش ماهانه', '📊'], ['m_requests', 'درخواست‌ها', '💬'], ['profile', 'پروفایل', '👤']]; }
  else { items = [['r_charges', 'صورتحساب', '📄'], ['r_pay', 'پرداخت', '💸'], ['r_requests', 'درخواست‌ها', '💬'], ['profile', 'پروفایل', '👤']]; }
  el.innerHTML = `<h1>خدمات</h1><p class="sub">دسترسی سریع به بخش‌های سامانه</p><div class="grid g3">${items.map(([k, l, ic]) => `<button class="card" data-go="${k}" style="cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:20px;gap:10px;border:0;text-align:center"><div style="font-size:32px">${ic}</div><b>${l}</b></button>`).join('')}</div>`;
  $$('[data-go]', el).forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
}
async function viewProfile(el) {
  const m = currentMembership();
  el.innerHTML = `<h1>پروفایل</h1><p class="sub">اطلاعات حساب شما</p><div class="card" style="margin-bottom:20px"><h2>اطلاعات حساب</h2><div class="grid g2" style="margin-top:12px"><div><small class="sub">نام کاربری</small><div style="font-weight:800;direction:ltr;text-align:right">${esc(S.me.username)}</div></div><div><small class="sub">نقش</small><div style="font-weight:800">${S.me.is_superadmin ? 'ادمین اصلی' : (m?.access_role === 'manager' ? 'مدیر ساختمان' : (m?.resident_type ? (m.resident_type === 'owner_resident' ? 'مالک ساکن' : m.resident_type === 'tenant' ? 'مستاجر' : 'مالک') : '—'))}</div></div>${m ? `<div><small class="sub">ساختمان</small><div style="font-weight:800">${esc(m.building_name)}</div></div>` : ''}</div></div><form id="pf-pass" class="card grid" style="gap:14px;max-width:640px;margin-top:20px"><h2>تغییر رمز عبور</h2><p class="sub">${PWD_HINT}</p><label class="f">رمز جدید<input id="p-new" type="password" dir="ltr" maxlength="64" autocomplete="new-password"></label><label class="f">تکرار رمز<input id="p-new2" type="password" dir="ltr" maxlength="64"></label><button class="btn lt" type="submit">تغییر رمز</button></form><div class="card" style="margin-top:20px"><h2>تم رنگی</h2>${themeSwatchesHTML()}</div>`;
  bindThemeSwatches(el);
  $('#pf-pass').addEventListener('submit', async e => {
    e.preventDefault(); const np = $('#p-new').value, np2 = $('#p-new2').value;
    if (!isStrongPwd(np)) { toastErr(PWD_HINT); return; }
    if (np !== np2) { toastErr('تکرار رمز یکسان نیست'); return; }
    try { await T('app_change_password', { p_new_password: np }); S.me.must_change_password = false; persistSession(); toastOk('رمز تغییر کرد'); } catch (err) { showErr(err); }
  });
}

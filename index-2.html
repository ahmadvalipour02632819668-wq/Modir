<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2d3463">
  <title>مدیر | مدیریت مجتمع‌های مسکونی</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 20px;
      display: grid; place-items: center;
      background: #f3f5fa; color: #202747;
      font-family: Vazirmatn, sans-serif;
    }
    main {
      width: min(100%, 520px); padding: 32px;
      text-align: center; background: #fff;
      border: 1px solid #e5e8f0; border-radius: 22px;
      box-shadow: 0 18px 55px #20274712;
    }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 18px;
      display: grid; place-items: center; border-radius: 18px;
      background: #2d3463; color: white; font-size: 30px; font-weight: 900;
    }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { margin: 8px 0; color: #69718a; line-height: 2; }
    .status {
      display: inline-block; margin-top: 18px; padding: 7px 14px;
      border-radius: 30px; background: #fff4df; color: #8a5a0a;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">م</div>
    <h1>سامانه مدیریت مجتمع‌های مسکونی</h1>
    <p>پروژه «مدیر» آماده راه‌اندازی اولیه است.</p>
    <p>این فایل، نقطه شروع سایت است. پنل‌ها، ثبت‌نام، اتصال پایگاه داده و منطق مالی باید در مراحل بعدی روی همین پروژه پیاده‌سازی و آزمایش شوند.</p>
    <span class="status">نسخه اولیه — در حال آماده‌سازی</span>
  </main>
</body>
</html>
